<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Contacto - AgendaKinal</title>
    <link rel="stylesheet" href="../css/nuevo.css">
</head>
<body class="fondo-azul">
    <div class="cuadro-blanco">
        <h1 class="titulo">NUEVO <span class="naranja">CONTACTO</span></h1>
        <form>
            <input type="text" class="input-kinal" placeholder="Nombre completo">
            <input type="tel" class="input-kinal" placeholder="Teléfono">
            <input type="email" class="input-kinal" placeholder="Correo electrónico">
            
            <button type="button" class="btn-naranja" onclick="location.href='contactos.html'">GUARDAR</button>
            <button type="button" class="btn-gris" onclick="location.href='contactos.html'">CANCELAR</button>
        </form>
    </div>
</body>
</html>
