<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LoginAgenda</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="fondo-azul">

    <div class="cuadro-blanco">
        
        <h1 class="titulo">
            AGENDA<span class="naranja">KINAL</span>
        </h1>
        <p>Ingresa tus datos</p>

        <form>
            <p>Correo:</p>
            <input type="email" id="emailInput" placeholder="tu@correo.com" class="caja-texto">
            
            <p>Contraseña:</p>
            <input type="password" id="passInput" class="caja-texto">
            
            <button type="button" class="boton-naranja" onclick="guardarYEntrar()">
                ENTRAR
            </button>
        </form>

    </div>

    <script src="js/index.js"></script>
</body>
</html>
